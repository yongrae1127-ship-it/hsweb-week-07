<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>7주차 예제 6 · sticky — 스크롤하다 붙는 헤더</title>
  <style>
    /*
    7주차 예제 6 — sticky — 스크롤하다 붙는 헤더
    */
    .navbar {
      position: sticky;
      top: 0;            /* top(또는 bottom)을 반드시 지정해야 동작합니다 */
      z-index: 10;       /* 다른 것에 가리지 않게 */
      background: #fff;  /* 배경이 없으면 아래 내용이 비쳐 보입니다 */
    }
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>
