<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>7주차 예제 5 · absolute는 relative 부모와 짝입니다</title>
  <style>
    /*
    7주차 예제 5 — absolute는 relative 부모와 짝입니다
    */
    .card {
      position: relative;    /* ← 이게 있어야 자식 absolute의 기준이 된다 */
    }

    .card .badge {
      position: absolute;
      top: -8px;
      right: -8px;           /* 카드 오른쪽 위 모서리에 배지 */
    }

    /* 부모에 position: relative가 없으면
       배지가 화면 전체 기준으로 날아가 버립니다 — 아주 흔한 실수입니다. */
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>
