<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>7주차 예제 4 · display로 성질을 바꿉니다</title>
  <style>
    /*
    7주차 예제 4 — display로 성질을 바꿉니다
    */
    span { display: block; }         /* 인라인 → 블록 */
    li   { display: inline; }        /* 블록 → 인라인 */
    a    { display: inline-block; }  /* 옆으로 이어지되 width/height는 먹는다 */
    .menu{ display: none; }          /* 화면에서 완전히 사라진다(자리도 없음) */
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>
